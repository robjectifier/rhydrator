id   = "rntuple/fundamental-types"
file = "data/rntuple/fundamental-types.root"

description = """
One field per fundamental C++ type, and the column each one lands in.

The tracked specification's *Fundamental Types* table marks a default column per
type with an asterisk, and then says: **"If the ntuple is stored uncompressed,
the default changes from split encoding to non-split encoding where
applicable."** Both halves are checkable. This case checks the uncompressed half
(thirteen types, thirteen columns, compression off), and the assertions below
are the table's asterisked row, read out of a real file.

All thirteen come out as the document says:

| C++ type | Column | Code | Bits |
|---|---|---|---|
| `bool` | Bit | 0x00 | 1 |
| `std::byte` | Byte | 0x01 | 8 |
| `char` | Char | 0x02 | 8 |
| `std::int8_t` | Int8 | 0x03 | 8 |
| `std::uint8_t` | UInt8 | 0x04 | 8 |
| `std::int16_t` | Int16 | 0x05 | 16 |
| `std::uint16_t` | UInt16 | 0x06 | 16 |
| `std::int32_t` | Int32 | 0x07 | 32 |
| `std::uint32_t` | UInt32 | 0x08 | 32 |
| `std::int64_t` | Int64 | 0x09 | 64 |
| `std::uint64_t` | UInt64 | 0x0A | 64 |
| `float` | Real32 | 0x0C | 32 |
| `double` | Real64 | 0x0D | 64 |

`Int16`, `Int32`, `Real32` and `Real64` appear here, not `SplitInt16`,
`SplitInt32`, `SplitReal32` and `SplitReal64`, as the sentence about
uncompressed ntuples requires. A reader that assumes the split forms because
they are common in real files decodes every one of these columns incorrectly.

The same file shows two more claims. Each of the thirteen is a plain field with
exactly one column, as the section's opening sentence says. The type names
follow the normalization rule that "the integer types ... are replaced by the
corresponding `std::[u]int(8|16|32|64)_t` standard integer typedef": the sized
integers are normalized, while `bool`, `char`, `std::byte`, `float` and `double`
are stored as spelled.

`tools/test_rntuple.py` parses that table out of the tracked copy and compares it
against this file's decoded schema, so the two cannot drift apart silently on a
submodule bump, as `check_versions.py` does for class versions.
"""

spec = [
  "spec/05-rntuple/NOTES.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

# Same cause as rntuple/anchor: ROOT::RNTuple's std::uint64_t members are
# recorded with a different fType and type name under libstdc++, a 28-byte
# length difference no mask can undo. ElementTypes.md 2.4, PLAN.md 9.6.
digest        = false
digest_reason = """
ROOT::RNTuple's seven std::uint64_t members are recorded as fType 17 `ULong64_t`
with libc++ and fType 14 `unsigned long` with libstdc++: a 28-byte length
difference a mask cannot undo. The byte assertions still run. ElementTypes.md 2.4
"""

