id   = "rntuple/compressed"
file = "data/rntuple/compressed.root"

# No `size`: 1420 bytes when libc++ wrote it and 1418 when libstdc++ did, for the
# reason `digest_reason` below gives. Every offset asserted here is at or below
# 490, and the divergence is in the StreamerInfo record at 950.

description = """
A compressed RNTuple page. Every other RNTuple case here calls
`opts.SetCompression(0)` so that the envelopes are readable in place and the
assertions are about the format rather than a codec (`rntuple/anchor` explains).
The side effect is that an `RBlob` payload is stored raw in all of them, so
[Compression §9](../../../spec/01-container/Compression.md)'s chain invariants
never run on one. This case turns compression on, which is RNTuple's default,
so they do.

**A sealed page's block chain stops 8 bytes short of its payload.** The page
`RBlob` here is at 381 with `fNbytes` 109 and `fKeylen` 42, so its payload is
423..490. Its one `ZL` block declares 50 compressed bytes, so the chain ends at
`423 + 9 + 50` = 482. The eight bytes from 482 to 490 are the page's XXH3-64
checksum, appended after compression and counted outside `fObjLen`:
`kNBytesPageChecksum` is `sizeof(std::uint64_t)`
(`root/tree/ntuple/inc/ROOT/RPageStorage.hxx:74`) and a page is sealed as
`nBytesZipped + nBytesChecksum` (`root/tree/ntuple/src/RPageStorage.cxx:751`).
The assertions check 482 and 490 together, as `rntuple/anchor` does with 1122
and 1130 for ERRATUM 3.

The file has four `RBlob`s rather than one to show that this is a rule for
pages and not an exception. The header envelope at 234, the page list at 490 and
the footer at 609 all close flush with their payloads; only the page at 381 is
short. An envelope's checksum is inside its own declared length; a page's is
not. `Compression.md` §9.1 states this distinction.

`fObjLen` is 2048, not the file's size, because it is the uncompressed page:
512 entries of `std::int32_t`. The values run in blocks of 64 so that zlib has
runs to find; 512 distinct values would be stored raw. zlib rather than
RNTuple's default zstd, because §3 already pins the `ZL` block header and this
case is about the framing around it, not the codec.

The block header and the checksum are asserted as bytes because they are
portable: the arm64 libstdc++ container writes `5a 4c 08 32 00 00 00 08 00`
and `fb 9e c3 08 fa 1f 77 e6` at the same offsets, identical to libc++. Only the
file's total length differs, because of the `ROOT::RNTuple` streamer info far
below.
"""

spec = [
  "spec/01-container/Compression.md",
  "spec/05-rntuple/NOTES.md",
]

root_version = "6.40.04"
compression  = { algorithm = "zlib", setting = 101 }

digest        = false
digest_reason = """
`std::uint64_t` resolves to `unsigned long long` with libc++ and `unsigned long`
with libstdc++, so ROOT::RNTuple's seven 64-bit members are recorded as fType 17
`ULong64_t` on one and fType 14 `unsigned long` on the other: a length
difference a mask cannot undo, and all of the 2-byte difference in this file's
size. It is in the StreamerInfo record at 950; every byte asserted here is at or
below 490. ElementTypes.md 2.4, PLAN.md 9.6
"""

[[records]]
offset = 100
nbytes = 134
class  = "TFile"
role   = "the root directory record"
[[records]]
offset = 234
nbytes = 147
class  = "RBlob"
role   = "the header envelope -- compressed, and its chain closes flush"
[[records]]
offset = 381
nbytes = 109
class  = "RBlob"
role   = "the page: one sealed page, whose block chain stops 8 bytes short"
[[records]]
offset = 490
nbytes = 119
class  = "RBlob"
role   = "the page list envelope -- closes flush"
[[records]]
offset = 609
nbytes = 118
class  = "RBlob"
role   = "the footer envelope -- closes flush"
[[records]]
offset = 727
nbytes = 113
class  = "ROOT::RNTuple"
role   = "the anchor, compressed -- which rootfile.read_rntuple_anchor cannot read"

# -- The page key. Compression.md 9.1, Record.md 2 --------------------------

[[bytes]]
name = "the page RBlob: fNbytes, so the payload ends at 381 + 109 = 490"
offset = 381
type = "i32"
value = 109

[[bytes]]
name = "fVersion 1004 -- a large key, as every key in a 6.40 file is"
offset = 385
type = "i16"
value = 1004

[[bytes]]
name = "fObjLen 2048: the UNCOMPRESSED page, 512 x int32, not anything on disk"
offset = 387
type = "i32"
value = 2048

[[bytes]]
name = "fKeylen 42, so the payload begins at 381 + 42 = 423"
offset = 395
type = "i16"
value = 42

[[bytes]]
name = "the artificial class name RNTuple gives its payload records"
offset = 415
type = "string"
value = "RBlob"

# -- The one compression block. Compression.md 3 ----------------------------

[[bytes]]
name = "ZL: zlib, the only block in this page's chain"
offset = 423
type = "bytes"
value = "ZL"

[[bytes]]
name = "the method byte: 8, zlib's deflate"
offset = 425
type = "u8"
value = 8

[[bytes]]
name = "compressed size 50, little-endian in three bytes -- so the chain ends at 423 + 9 + 50 = 482"
offset = 426
type = "bytes"
value = [50, 0, 0]

[[bytes]]
name = "uncompressed size 2048, and it equals fObjLen: this page IS the whole object the key describes"
offset = 429
type = "bytes"
value = [0, 8, 0]

# -- The finding. Compression.md 9.1 ----------------------------------------

[[bytes]]
name = "THE FINDING: the 8 bytes from 482 to 490, past the end of the block chain and outside fObjLen -- the page's XXH3-64 checksum"
offset = 482
type = "bytes"
value = [251, 158, 195, 8, 250, 31, 119, 230]
