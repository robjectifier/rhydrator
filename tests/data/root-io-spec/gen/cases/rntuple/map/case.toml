id   = "rntuple/map"
file = "data/rntuple/map.root"

description = """
The associative containers of *Stdlib Types and Collections*, one field each:
`std::map`, `std::unordered_map`, `std::multimap` and `std::unordered_multimap`,
the four types the document's `std::map` subsection covers in one paragraph.
Two entries: the first fills every map, the second leaves them all empty.

The claim is that each is "a collection parent field, whose principal column is
of type `(Split)Index[64|32]` and a child field of type `std::pair<K, V>` named
`_0`". It holds for all four, and the pair child is a record parent with no
columns of its own and children `_0` and `_1`, the same shape as a top-level
`std::pair` in `rntuple/collections`. Type names are normalised inside the
arguments too: `std::map<std::string,std::int32_t>`.

**Each instantiation is one ROOT ships a compiled dictionary for**, which is why
this fixture could not be written before 2026-09-23. From the interpreter, ROOT
6.40.04 writes a map field only when the class under RNTuple's normalised type
name has a dictionary; otherwise `Fill()` aborts with `R__ASSERT(0)` in
`TGenCollectionProxy__VectorNext` (`root/io/io/src/TGenCollectionProxy.cxx:1528-1530`).
NOTES.md 5 has the measurement.

Two page locators can name the same bytes. `fMap` and `fMulti` both hold two
pairs and then none, so their index columns' pages are identical, 2 then 2; so
are `fUnordered`'s and `fUnMulti`'s, 1 then 1. ROOT writes each such page once
and points both locators at it: `EnableSamePageMerging`, on by default
(`root/tree/ntuple/src/RPageStorage.cxx:1117-1142`). The tracked document does
not say that page locators can alias. NOTES.md 7.

Every column is asserted by type code and bit width in schema order, then the
header envelope's preamble, the pages' contents, and the four aliased locators.
The fields' names and roles are checked through the decoded schema in
`tools/test_rntuple.py`.
"""

# The same standard-library difference as the other RNTuple cases: the
# ROOT::RNTuple anchor's streamer info is recorded with a different fType and type
# name under libstdc++, a length difference no mask can undo. ElementTypes.md 2.4,
# PLAN.md 9.6.
digest        = false
digest_reason = """
ROOT::RNTuple's seven std::uint64_t members are recorded as fType 17 `ULong64_t`
with libc++ and fType 14 `unsigned long` with libstdc++: a 28-byte length
difference a mask cannot undo. The byte assertions still run. ElementTypes.md 2.4
"""

