nbytes = 82
class  = "RBlob"
role   = "a page"
[[records]]
offset = 590
nbytes = 206
class  = "RBlob"
role   = "the page list envelope"
[[records]]
offset = 796
nbytes = 202
class  = "RBlob"
role   = "the footer envelope"
[[records]]
offset = 998
nbytes = 132
class  = "ROOT::RNTuple"
role   = "the anchor"
[[records]]
offset = 1236
nbytes = 1298
class  = "TList"
role   = "StreamerInfo"

