id   = "rntuple/attributes"
file = "data/rntuple/attributes.root"

# No `size`: the StreamerInfo record is the last one in the file and is 28 bytes
# longer with libstdc++, for the reason `digest_reason` below gives. gen.C holds
# it back until the end so that every offset asserted here, all below 4153, is
# the same on both platforms; left alone, ROOT writes it at the first attribute
# set's commit, in the middle of the file, and everything after it would move.

description = """
Linked attribute sets: two attribute set RNTuples linked from the footer of a main
RNTuple. This is the fixture for the audit of *Linked Attribute Sets* and
*Linked Attribute Set Record Frame* in the tracked copy; before it, no fixture had
a non-empty attribute set list.

The main RNTuple `ntpl` has one `float` field `x` and six entries. Two sets:

| Set | User fields | Entries (`_rangeStart`, `_rangeLen`) | Values |
|---|---|---|---|
| `runs` | `run` (`std::int32_t`), `weight` (`float`) | (0, 3), (3, 3) | run 1, 2; weight 0.25, 0.75 |
| `flags` | `flag` (`std::uint16_t`) | (3, **0**), (1, 4) | 7, 9 |

Each set is an RNTuple of its own, with header, pages, page list, footer and
anchor, as the document says. What the bytes show:

- **The footer's last list frame** at 3824 has two record frames, of 36 and 37
  bytes: `Schema Version Major` 1 and `Minor` 0 as two `u16`, the anchor length as
  a `u32`, a simple locator, and the name as an RNTuple string, in the order the
  document's diagram and sentence give.
- **The anchor length is 78**, which is the whole anchor object: the byte count
  and class version the anchor schema omits (ERRATA 2), the schema's 64 bytes and
  the 8-byte checksum. The document says only that it "includes the 8 bytes of
  the checksum", and a reader adding them to its anchor schema gets 72.
  **ERRATA 12.** The same 78 is the anchor key's `fObjLen`.
- **The locator names the anchor object, not its key**: 78 bytes at 2508 for
  `runs`, whose key starts at 2462 with a 46-byte key header, and at 3451 for
  `flags`. That key is not in the directory: the file's only key list, at 4041,
  holds one key, `ntpl`. A reader finds an attribute set's anchor through the
  footer and nowhere else. NOTES 8.
- **The internal schema is 1.0's, in order**: `_rangeStart` and `_rangeLen`, plain
  `std::uint64_t` fields, then `_userData`, a record (role 0x02) whose type name
  is a string of length 0, the untyped record the document names. The user's
  fields are its children, parent ID 2, under their own names.
- **The three restrictions hold**: each set's own footer has an empty attribute
  set list, both alias column lists are empty, and no field has role 0x04.
- **`_rangeLen` 0 is written and read**: `flags`' first entry is (3, 0). The
  entries are in commit order, not in order of their starts: the empty range was
  committed before the (1, 4) range that had begun earlier.

Every page is asserted too, because the ranges are the point of the format: the
two `u64` values of each range column and the user values, at the page offsets
the sets' page lists give (`tools/test_rntuple.py` reads them back through the
page lists rather than trusting these offsets).
"""

spec = [
  "spec/05-rntuple/ERRATA.md",
  "spec/05-rntuple/NOTES.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

# The same standard-library difference as the other RNTuple cases, confined here
# to the last record of the file by gen.C. ElementTypes.md 2.4, PLAN.md 9.6.
digest        = false
digest_reason = """
ROOT::RNTuple's seven std::uint64_t members are recorded as fType 17 `ULong64_t`
with libc++ and fType 14 `unsigned long` with libstdc++: a 28-byte length
difference a mask cannot undo. The byte assertions still run. ElementTypes.md 2.4
"""

